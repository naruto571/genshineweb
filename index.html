<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>原神攻略社 · 大学生攻略社区</title>
<style>
:root{
  --blue:#59AFFF; --blue-d:#2E7DD1; --blue-l:#E8F3FF; --blue-ll:#F3F9FF;
  --gold:#D4AF37; --gold-d:#9A7B1E; --gold-l:#FFF7E2;
  --bg:#F5F7FA; --ink:#16202B; --sub:#6B7686; --muted:#9AA5B1; --line:#E9EDF2;
  --card:#FFFFFF; --danger:#E6432C; --ok:#4FA85F;
  --pyro:#E6432C; --hydro:#17A3B8; --cryo:#5EC2E6; --electro:#8B5CF6;
  --dendro:#65B84E; --anemo:#72C4B6; --geo:#C8A068;
  --r-lg:18px; --r-md:14px; --r-sm:10px;
  --shadow:0 6px 18px rgba(22,32,43,.06);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); color:var(--ink); background:#DDE5EE;
  display:flex; justify-content:center; height:100vh; height:100dvh; overflow:hidden;
}
.phone{
  position:relative; width:100%; max-width:430px; height:100vh; height:100dvh; background:var(--bg);
  display:flex; flex-direction:column; overflow:hidden;
  box-shadow:0 0 0 1px rgba(255,255,255,.4), 0 20px 60px rgba(20,40,70,.18);
}
.statusbar{
  height:44px; flex:0 0 44px; display:flex; align-items:center; justify-content:space-between;
  padding:0 20px; font-size:14px; font-weight:600; letter-spacing:.2px;
  background:linear-gradient(180deg,#FFFFFF 0%,rgba(255,255,255,.86) 100%);
  color:var(--ink); position:relative; z-index:3;
}
.statusbar .dots{display:flex; gap:5px; align-items:center}
.statusbar .dot{width:15px;height:3px;border-radius:2px;background:#CBD5E1}

.view{flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding-bottom:84px; scrollbar-width:none}
.view::-webkit-scrollbar{display:none}

/* ---------- 通用 ---------- */
.page-head{padding:14px 18px 10px; display:flex; align-items:flex-end; justify-content:space-between; gap:12px}
.page-head h1{margin:0; font-size:24px; letter-spacing:-.4px; font-weight:800}
.page-head .sub{margin:4px 0 0; font-size:12px; color:var(--sub)}
.icon-btn{
  width:36px;height:36px;border-radius:50%;border:none;background:#fff;color:var(--ink);
  display:grid;place-items:center; box-shadow:0 2px 8px rgba(22,32,43,.06); cursor:pointer;
  transition:transform .16s ease, background .16s ease;
}
.icon-btn:active{transform:scale(.94)}
.icon-btn:focus-visible, .chip:focus-visible, .tab:focus-visible, .btn:focus-visible{outline:2px solid var(--blue-d); outline-offset:2px}
.btn{
  border:none; border-radius:999px; padding:11px 18px; font-size:14px; font-weight:700; font-family:var(--font);
  cursor:pointer; transition:transform .16s ease, box-shadow .16s ease, opacity .16s ease;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#6FB9FF,#3D93E8); color:#fff; box-shadow:0 6px 14px rgba(61,147,232,.28)}
.btn-primary:disabled{opacity:.4; box-shadow:none}
.btn-ghost{background:#fff; color:var(--blue-d); box-shadow:inset 0 0 0 1px rgba(89,175,255,.45)}
.btn-plain{background:#F1F4F8; color:var(--ink)}
.btn-danger{background:var(--danger); color:#fff}

.card{background:var(--card); border-radius:var(--r-lg); box-shadow:var(--shadow)}
.tag{display:inline-flex; align-items:center; gap:4px; font-size:11px; padding:3px 8px; border-radius:6px; font-weight:600; line-height:1.5}
.tag .d{width:6px;height:6px;border-radius:50%}
.t-blue{background:var(--blue-l); color:var(--blue-d)}
.t-gold{background:var(--gold-l); color:var(--gold-d); box-shadow:inset 0 0 0 1px rgba(212,175,55,.35)}
.t-piro{background:#FDECE9;color:var(--pyro)}
.t-geo{background:#F7EFE4;color:#8A6428}
.t-hydro{background:#E6F3F6;color:var(--hydro)}
.t-elec{background:#F0EAFB;color:#6D3FD3}
.t-cryo{background:#EAF7FD;color:#2E8FB5}

/* ---------- 首页 ---------- */
.hero-wrap{padding:4px 16px 0}
.hero{position:relative; border-radius:20px; overflow:hidden; height:148px; background:#CFE3FF; box-shadow:var(--shadow)}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center 62%; display:block}
.hero .scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,32,58,.62) 0%,rgba(11,32,58,.28) 46%,rgba(11,32,58,0) 78%)}
.hero .hero-txt{position:absolute; left:16px; bottom:14px; right:34%; color:#fff}
.hero .kicker{font-size:11px; letter-spacing:2px; opacity:.9; font-weight:600}
  .hero .hero-txt h2{margin:4px 0 3px; font-size:18px; line-height:1.25; letter-spacing:.2px; text-shadow:0 2px 10px rgba(0,20,40,.35)}
.hero .hero-txt p{margin:0; font-size:11px; opacity:.86}


.searchbar{
  margin:14px 16px 0; display:flex; align-items:center; gap:10px; background:#fff; border-radius:999px;
  padding:11px 14px; box-shadow:0 3px 12px rgba(22,32,43,.05); cursor:pointer; transition:box-shadow .18s ease;
}
.searchbar:active{box-shadow:0 1px 6px rgba(22,32,43,.06)}
.searchbar svg{flex:0 0 auto; color:var(--muted)}
.searchbar span{font-size:13px; color:var(--muted); flex:1}

.chips{display:flex; gap:8px; overflow-x:auto; padding:12px 16px 4px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; border:none; background:#fff; color:var(--sub); font-family:var(--font);
  font-size:12.5px; font-weight:600; padding:7px 13px; border-radius:999px; cursor:pointer;
  box-shadow:inset 0 0 0 1px var(--line); transition:all .18s ease;
}
.chip[aria-selected="true"]{background:var(--blue-d); color:#fff; box-shadow:0 4px 10px rgba(46,125,209,.28); font-weight:700}

.list-head{display:flex; align-items:center; justify-content:space-between; padding:14px 18px 8px}
.list-head h3{margin:0; font-size:14px; font-weight:800; letter-spacing:.2px}
.list-head .count{font-size:11.5px; color:var(--muted)}
.list-head .link{font-size:12px; color:var(--blue-d); background:none;border:none;font-family:var(--font);cursor:pointer;font-weight:600}

.grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 16px}
.g-card{background:#fff; border-radius:var(--r-md); overflow:hidden; box-shadow:0 4px 14px rgba(22,32,43,.05); cursor:pointer; transition:transform .18s ease; display:flex; flex-direction:column}
.g-card:active{transform:scale(.985)}
.g-cover{position:relative; aspect-ratio:4/3; overflow:hidden; background:#E8F0FA}
.g-cover img{width:100%;height:100%;object-fit:cover; display:block}
.g-cover .elem{position:absolute; top:8px; left:8px; width:22px;height:22px; border-radius:50%; display:grid;place-items:center; background:rgba(255,255,255,.92); box-shadow:0 2px 6px rgba(0,0,0,.12)}
.g-cover .elem i{width:10px;height:10px;border-radius:50%;display:block}
.g-cover .hot{position:absolute; right:8px; top:8px; font-size:10px; padding:2px 6px; border-radius:5px; background:rgba(212,175,55,.94); color:#3D2E00; font-weight:700}
.g-body{padding:9px 10px 10px; display:flex; flex-direction:column; gap:6px; flex:1}
.g-title{font-size:13px; font-weight:700; line-height:1.4; margin:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:36px}
.g-meta{display:flex; align-items:center; gap:6px; font-size:10.5px; color:var(--muted); margin-top:auto; padding-top:2px}
.g-meta .av{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,#B9D8FF,#6FA9E8)}
.g-meta .school{color:var(--blue-d); font-weight:600}
.g-meta .sp{margin-left:auto; display:flex; gap:8px}
.g-tags{display:flex; gap:5px; flex-wrap:wrap}

/* 骨架屏 */
.sk{background:#fff; border-radius:var(--r-md); overflow:hidden}
.sk .bar{background:linear-gradient(90deg,#EDF1F6 25%,#F6F9FC 37%,#EDF1F6 63%); background-size:400% 100%; animation:shine 1.4s ease infinite}
.sk .cover{aspect-ratio:4/3}
.sk .l1{height:12px; margin:10px 10px 8px; border-radius:4px; width:80%}
.sk .l2{height:10px; margin:0 10px 12px; border-radius:4px; width:52%}
@keyframes shine{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* 空态 / 错误态 */
.state{display:flex; flex-direction:column; align-items:center; padding:34px 30px 30px; text-align:center}
.state svg{width:132px;height:104px}
.state h4{margin:12px 0 6px; font-size:15px; font-weight:800}
.state p{margin:0; font-size:12.5px; color:var(--sub); line-height:1.7}
.state .btn{margin-top:16px}

/* ---------- 资讯 ---------- */
.news-banner{margin:6px 16px 0; border-radius:18px; overflow:hidden; position:relative; height:132px; box-shadow:var(--shadow)}
.news-banner img{width:100%;height:100%;object-fit:cover;display:block}
.news-banner .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,32,58,.15),rgba(11,32,58,.6))}
.news-banner .txt{position:absolute; left:14px; bottom:12px; color:#fff}
.news-banner .txt .k{font-size:10.5px; letter-spacing:2px; opacity:.9}
.news-banner .txt h2{margin:3px 0 0; font-size:16px; letter-spacing:.3px}
.news-list{padding:12px 16px 0; display:flex; flex-direction:column; gap:10px}
.n-item{display:flex; gap:12px; background:#fff; border-radius:var(--r-md); padding:10px; box-shadow:0 4px 14px rgba(22,32,43,.045); cursor:pointer; transition:transform .16s ease}
.n-item:active{transform:scale(.99)}
.n-thumb{width:86px;height:64px;border-radius:10px;overflow:hidden;flex:0 0 auto;background:#E9F0F8}
.n-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.n-main{flex:1; min-width:0; display:flex; flex-direction:column; gap:5px; justify-content:center}
.n-main h4{margin:0; font-size:13.5px; line-height:1.4; font-weight:700; display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.n-main .n-meta{display:flex; gap:8px; align-items:center; font-size:10.5px; color:var(--muted)}
.n-main .n-meta .type{color:var(--blue-d); font-weight:600}

/* ---------- 社区 ---------- */
.same-school{margin:6px 16px 0; border-radius:18px; padding:14px 16px; color:#fff; background:linear-gradient(120deg,#5AAEFF 0%,#2E7DD1 72%); box-shadow:0 10px 24px rgba(46,125,209,.26); position:relative; overflow:hidden}
.same-school::after{content:"";position:absolute; right:-30px; top:-40px; width:130px;height:130px;border-radius:50%; background:rgba(255,255,255,.14)}
.same-school .row{display:flex; align-items:center; justify-content:space-between; gap:10px; position:relative; z-index:1}
.same-school .sch{display:flex; align-items:center; gap:8px}
.same-school .sch b{font-size:15px; letter-spacing:.2px}
.same-school .sch small{display:block; font-size:11px; opacity:.85; margin-top:2px}
.same-school .go{background:rgba(255,255,255,.94); color:var(--blue-d); border:none; border-radius:999px; padding:8px 14px; font-size:12.5px; font-weight:700; font-family:var(--font); cursor:pointer}
.same-school .stats{display:flex; gap:18px; margin-top:12px; position:relative; z-index:1}
.same-school .stats div{font-size:11px; opacity:.9}
.same-school .stats div b{display:block; font-size:17px; letter-spacing:.5px; margin-bottom:1px}
.same-school .stats div b span{font-size:11px; font-weight:500; opacity:.85}

.posts{padding:14px 16px 0; display:flex; flex-direction:column; gap:12px}
.post{background:#fff; border-radius:var(--r-lg); padding:13px 14px; box-shadow:0 4px 16px rgba(22,32,43,.05)}
.post .ph{display:flex; align-items:center; gap:9px}
.post .ph .av{width:34px;height:34px;border-radius:50%; background:linear-gradient(135deg,#CDE4FF,#6FA9E8); display:grid; place-items:center; color:#fff; font-weight:800; font-size:13px}
.post .ph .who{flex:1; min-width:0}
.post .ph .who b{font-size:13px; display:block}
.post .ph .who small{font-size:10.5px; color:var(--muted); display:flex; gap:6px; align-items:center}
.post .ph .who small .s{color:var(--blue-d); font-weight:600}
.post .body{margin:10px 0 0; font-size:13px; line-height:1.65; color:#2A3542}
.post .pimg{margin-top:10px; border-radius:12px; overflow:hidden; aspect-ratio:16/9; background:#EAF1F9}
.post .pimg img{width:100%;height:100%;object-fit:cover;display:block}
.post .acts{display:flex; align-items:center; gap:6px; margin-top:10px; color:var(--muted); font-size:12px}
.act{display:inline-flex; align-items:center; gap:5px; border:none; background:none; padding:6px 8px; border-radius:8px; color:var(--muted); font-family:var(--font); font-size:12px; cursor:pointer; transition:background .16s}
.act:active{background:#F3F6FA}
.act.on{color:var(--blue-d)}
.act.on svg{color:var(--blue-d)}
.act.gold.on{color:var(--gold-d)}
.act.gold.on svg{color:var(--gold)}
.act .num{font-variant-numeric:tabular-nums}

/* ---------- 底部导航 ---------- */
.tabbar{
  position:absolute; left:0; right:0; bottom:0; height:66px; padding:0 6px 6px;
  background:rgba(255,255,255,.94); backdrop-filter:blur(14px); border-top:1px solid rgba(22,32,43,.05);
  display:flex; align-items:flex-end; justify-content:space-around; z-index:6;
}
.tab{flex:1; border:none; background:none; color:var(--muted); font-family:var(--font); font-size:10.5px; font-weight:600; display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 0 6px; cursor:pointer; position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--blue-d)}
.tab[aria-selected="true"] svg{color:var(--blue-d)}
.tab.mid{padding-bottom:3px}
.tab.mid .fab{
  width:48px;height:48px;border-radius:50%; margin-top:-22px; display:grid;place-items:center;
  background:linear-gradient(140deg,#79BEFF,#2E7DD1); color:#fff; box-shadow:0 8px 20px rgba(46,125,209,.38);
  border:3px solid #fff;
}
.tab.mid .lbl{margin-top:1px}
.phone.no-tab .tabbar{display:none}
.phone.no-tab .d-bar,.phone.no-tab .pub-foot,.phone.no-tab .team-foot{bottom:0}
.phone.no-tab .view{padding-bottom:88px}

/* ---------- 详情 ---------- */
.detail-hero{position:relative; height:216px; background:#DCE9F8}
.detail-hero img{width:100%;height:100%;object-fit:cover;display:block}
.d-topbar{position:absolute; top:10px; left:0; right:0; display:flex; align-items:center; justify-content:space-between; padding:0 12px; z-index:2}
.round-btn{width:36px;height:36px;border-radius:50%; border:none; background:rgba(255,255,255,.9); backdrop-filter:blur(8px); display:grid; place-items:center; color:var(--ink); box-shadow:0 3px 10px rgba(0,0,0,.12); cursor:pointer}
.d-body{margin-top:-18px; position:relative; background:var(--bg); border-radius:20px 20px 0 0; padding:16px 18px 10px}
.d-body h1{margin:0; font-size:19px; line-height:1.35; letter-spacing:-.2px}
.d-tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px}
.d-author{display:flex; align-items:center; gap:9px; margin-top:14px; padding:11px 12px; background:#fff; border-radius:14px; box-shadow:0 3px 12px rgba(22,32,43,.04)}
.d-author .av{width:36px;height:36px;border-radius:50%; background:linear-gradient(135deg,#CDE4FF,#6FA9E8); display:grid; place-items:center; color:#fff; font-weight:800}
.d-author .w{flex:1}
.d-author .w b{font-size:13px; display:block}
.d-author .w small{font-size:11px; color:var(--muted)}
.d-content{font-size:14px; line-height:1.85; color:#26313D; margin-top:14px}
.d-content p{margin:0 0 12px}
.d-content .figure{margin:14px 0; border-radius:12px; overflow:hidden; background:#E9F0F8}
.d-content .figure img{width:100%; display:block}
.d-content .cap{font-size:11px; color:var(--muted); text-align:center; margin:6px 0 16px}
.d-content h4{margin:18px 0 8px; font-size:14.5px; color:var(--blue-d); letter-spacing:.2px}
.d-bar{
  position:absolute; left:0; right:0; bottom:66px; padding:9px 14px calc(9px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.96); backdrop-filter:blur(14px); border-top:1px solid rgba(22,32,43,.06);
  display:flex; align-items:center; gap:8px; z-index:5;
}
.d-bar .cmt{flex:1; display:flex; align-items:center; gap:8px; background:#F2F5F9; border-radius:999px; padding:9px 14px; color:var(--muted); font-size:12.5px; cursor:pointer}
.d-bar .icon-act{width:38px;height:38px;border-radius:50%; border:none; background:#F2F5F9; display:grid;place-items:center; color:var(--sub); cursor:pointer; position:relative}
.d-bar .icon-act.on{color:var(--blue-d); background:var(--blue-l)}
.d-bar .icon-act.gold.on{color:var(--gold-d); background:var(--gold-l)}

/* 评论 */
.cmt-list{padding:6px 18px 16px}
.cmt-list h4{margin:12px 0 10px; font-size:13px; color:var(--sub); font-weight:700; letter-spacing:.3px}
.cmt{display:flex; gap:9px; padding:9px 0; border-bottom:1px solid var(--line)}
.cmt .av{width:30px;height:30px;border-radius:50%; background:linear-gradient(135deg,#E2D3FF,#9E7BEA); flex:0 0 auto; display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
.cmt .c{flex:1}
.cmt .c b{font-size:12px; color:#3A4654}
.cmt .c p{margin:3px 0 0; font-size:12.5px; line-height:1.6; color:#2A3542}
.cmt .c small{font-size:10.5px; color:var(--muted)}

/* ---------- 搜索 ---------- */
.search-page{padding:10px 16px 0}
.s-box{display:flex; align-items:center; gap:8px; background:#fff; border-radius:999px; padding:9px 6px 9px 14px; box-shadow:0 3px 12px rgba(22,32,43,.06)}
.s-box input{flex:1; border:none; outline:none; font-family:var(--font); font-size:14px; background:none; color:var(--ink); min-width:0}
.s-box input::placeholder{color:var(--muted)}
.s-box .clr{width:26px;height:26px;border-radius:50%;border:none;background:#EFF3F8;color:var(--sub);display:grid;place-items:center;cursor:pointer}
.s-box .do{margin-left:2px}
.s-hist{margin-top:16px}
.s-hist .h{display:flex; align-items:center; justify-content:space-between}
.s-hist .h b{font-size:12.5px; color:var(--sub); letter-spacing:.3px}
.s-hist .h button{background:none;border:none;font-family:var(--font);font-size:11.5px;color:var(--muted);cursor:pointer}
.h-chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.h-chips .chip{box-shadow:none; background:#fff; color:#51606F}
.s-res{padding:6px 16px 0; display:flex; flex-direction:column; gap:9px}
.r-item{display:flex; gap:11px; background:#fff; border-radius:14px; padding:9px; box-shadow:0 3px 12px rgba(22,32,43,.045); cursor:pointer}
.r-item img{width:78px;height:58px;border-radius:9px;object-fit:cover;flex:0 0 auto}
.r-item .m{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:4px}
.r-item .m b{font-size:13px; line-height:1.35; display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.r-item .m small{font-size:10.5px; color:var(--muted)}
.r-item .m .kw{color:var(--blue-d); font-weight:700}

/* ---------- 发布 ---------- */
.pub-head{display:flex; align-items:center; gap:10px; padding:10px 14px}
.pub-head .t{flex:1; text-align:center; font-size:15px; font-weight:700; letter-spacing:.2px}
.pub-body{padding:2px 16px 20px}
.pub-card{background:#fff; border-radius:16px; padding:14px 14px 6px; box-shadow:0 4px 16px rgba(22,32,43,.045)}
.field{margin-bottom:14px}
.field label{display:flex; align-items:center; justify-content:space-between; font-size:11.5px; color:var(--sub); font-weight:700; letter-spacing:.4px; margin-bottom:7px}
.field label .cnt{font-weight:500; color:var(--muted); font-variant-numeric:tabular-nums}
.inp{width:100%; border:none; background:#F5F8FC; border-radius:12px; padding:12px 13px; font-family:var(--font); font-size:14px; color:var(--ink); outline:none; transition:box-shadow .16s}
.inp:focus{box-shadow:inset 0 0 0 1.5px rgba(89,175,255,.55); background:#fff}
.inp.err{box-shadow:inset 0 0 0 1.5px rgba(230,67,44,.55); background:#FFF8F7}
textarea.inp{resize:none; min-height:128px; line-height:1.7}
.errmsg{display:none; margin-top:6px; font-size:11.5px; color:var(--danger); font-weight:600}
.errmsg.show{display:block}
.tagpick{display:flex; flex-wrap:wrap; gap:8px}
.tp{border:none; background:#F5F8FC; color:#51606F; font-family:var(--font); font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:999px; cursor:pointer; transition:all .16s}

.toast{position:absolute; left:50%; bottom:110px; transform:translate(-50%,12px); background:rgba(22,32,43,.88); color:#fff; font-size:12.5px; padding:11px 16px; border-radius:12px; max-width:78%; text-align:center; line-height:1.5; opacity:0; pointer-events:none; transition:opacity .22s ease, transform .22s ease; z-index:20; backdrop-filter:blur(6px)}

.mask{position:absolute; inset:0; background:rgba(12,20,30,.42); display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:15; padding:0 30px}

function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2000); }

let dialogResolve=null;
function confirmDialog({title,content,okText='确定',cancelText='取消',danger=false}){
  $('#dlgTitle').textContent=title;
  $('#dlgContent').textContent=content;
  $('#dlgOk').textContent=okText;
  $('#dlgOk').className='ok'+(danger?' danger':'');
  $('#dlgCancel').textContent=cancelText;
  const mask=$('#mask'); mask.classList.add('show'); mask.setAttribute('aria-hidden','false');
  return new Promise(res=>{ dialogResolve=res; });
}
function closeDialog(v){
  const mask=$('#mask'); mask.classList.remove('show'); mask.setAttribute('aria-hidden','true');
  if(dialogResolve){ const r=dialogResolve; dialogResolve=null; r(v); }
}
$('#dlgCancel').addEventListener('click',()=>closeDialog(false));
$('#dlgOk').addEventListener('click',()=>closeDialog(true));
$('#mask').addEventListener('click',e=>{ if(e.target.id==='mask') closeDialog(false); });

function openSheet(title, bodyHTML){

const view = $('#view');

function setTabActive(tab){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', String(t.dataset.tab===tab)));
}

function go(route){ location.hash = '#/'+route; }

window.addEventListener('hashchange',()=>{ render(); });
function parseHash(){
  const h=location.hash.replace(/^#\//,'')||'home';
  const [name,id]=h.split('/');
  return {name,id};
}

function render(){
  const {name,id}=parseHash();
  currentRoute=name;
  const primary=['home','news','square','publish','me'];
  const subPages=['publish','detail','search','team','newsdetail','fav','myposts','drafts','msgs','settings'];
  if(primary.includes(name)) setTabActive(name);
  else setTabActive('');
  $('#phone').classList.toggle('no-tab', subPages.includes(name));
  view.scrollTop=0;
  if(name==='home') view.innerHTML=HomeView();
  else if(name==='news') view.innerHTML=NewsView();
  else if(name==='square') view.innerHTML=SquareView();
  else if(name==='publish') view.innerHTML=PublishView();
  else if(name==='me') view.innerHTML=MeView();
  else if(name==='detail') view.innerHTML=DetailView(id);
  else if(name==='search') view.innerHTML=SearchView();
  else if(name==='team') view.innerHTML=TeamView(id||'p2');
  else if(name==='fav') view.innerHTML=FavView();
  else if(name==='myposts') view.innerHTML=MyPostsView();
  else if(name==='drafts') view.innerHTML=DraftsView();
  else if(name==='msgs') view.innerHTML=MsgsView();
  else if(name==='settings') view.innerHTML=SettingsView();
  else if(name==='newsdetail') view.innerHTML=NewsDetailView(id);
  else view.innerHTML=HomeView();
  bindViewEvents();
}

/* ===== 事件绑定 ===== */
function bindViewEvents(){
  // 通用跳转
  view.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click',()=>go(el.dataset.open));
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go(el.dataset.open);}});
  });
  view.querySelectorAll('[data-go]').forEach(el=>{
    el.addEventListener('click',()=>go(el.dataset.go));
  });
  view.querySelectorAll('[data-back]').forEach(el=>{
    el.addEventListener('click',()=>history.back());
  });

  // 首页
  view.querySelectorAll('[data-act="filter"]').forEach(el=>{
    el.addEventListener('click',()=>{
      view.querySelectorAll('[data-act="filter"]').forEach(c=>c.setAttribute('aria-selected','false'));
      el.setAttribute('aria-selected','true');
      const v=el.dataset.v;
      if(v==='全部'){ render(); return; }
      toast('已筛选：'+v);
    });
  });
  const statesBtn=view.querySelector('[data-act="states"]');
  if(statesBtn) statesBtn.addEventListener('click',()=>{
    const opts=[['normal','正常浏览'],['loading','加载中（骨架屏）'],['empty','空数据'],['error','网络错误'],['guest','游客模式（未登录）']];
    openSheet('演示 · 页面状态', '<div style="padding:2px 18px 8px;font-size:11.5px;color:#9AA5B1;line-height:1.6">切换首页的正常 / 加载 / 空 / 错误状态，并验证未登录时的互动限制。</div>'+opts.map(([k,label])=>`<button class="opt ${store.homeState===k?'on':''}" data-state="${k}">${label}<span>${store.homeState===k?'✓':''}</span></button>`).join('')+'<button class="opt" data-neterr="1">模拟断网发布</button>');
    $('#sheetBody').querySelectorAll('[data-state]').forEach(b=>b.addEventListener('click',()=>{
      store.homeState=b.dataset.state; closeSheet(); render();
      if(store.homeState==='loading') setTimeout(()=>{ if(store.homeState==='loading'){ store.homeState='normal'; render(); toast('加载完成'); } },900);
      if(store.homeState==='error') toast('加载失败，可点击重试');
      if(store.homeState==='empty') toast('该分类暂无内容');
      if(store.homeState==='guest'){ store.loggedIn=false; store.homeState='normal'; render(); toast('已切换为游客模式，试试点赞或收藏'); }
    }));
    $('#sheetBody').querySelectorAll('[data-neterr]').forEach(b=>b.addEventListener('click',()=>{ store.netFail=true; closeSheet(); toast('已开启断网模拟，可在发布页试试'); }));
  });
  const retry=view.querySelector('[data-act="retry"]');
  if(retry) retry.addEventListener('click',()=>{
    store.homeState='loading'; render();
    setTimeout(()=>{ store.homeState='normal'; render(); toast('已恢复连接'); },900);
  });
  const refresh=view.querySelector('[data-act="refresh"]');
  if(refresh) refresh.addEventListener('click',()=>toast('已刷新，最新资讯 2 小时前更新'));

  // 点赞 / 收藏
  view.querySelectorAll('[data-like]').forEach(el=>{
    el.addEventListener('click',()=>{
      const k=el.dataset.like;
      const cur=!!store.liked[k];
      store.liked[k]=!cur; SAVE();
      const n=el.querySelector('.num');
      if(n) n.textContent=String(parseInt(n.textContent,10)+(cur?-1:1));
      el.setAttribute('aria-pressed',String(!cur));
      el.classList.toggle('on',!cur);
      const svg=el.querySelector('svg path');
      if(svg) svg.setAttribute('fill',cur?'none':'currentColor');
      toast(cur?'已取消点赞':'已点赞');
    });
  });
  view.querySelectorAll('[data-fav]').forEach(el=>{
    el.addEventListener('click',()=>{
      const k=el.dataset.fav; const cur=!!store.faved[k];
      store.faved[k]=!cur; if(!store.faved[k]) delete store.faved[k];
      SAVE();
      el.classList.toggle('on',!cur); el.setAttribute('aria-pressed',String(!cur));
      const svg=el.querySelector('svg path'); if(svg) svg.setAttribute('fill',cur?'none':'currentColor');
      el.style.transform='scale(1.18)'; setTimeout(()=>el.style.transform='',180);
      toast(cur?'已取消收藏':'已收藏，可在「我的-我的收藏」查看');
    });
  });

  // 评论
  view.querySelectorAll('[data-act="comment"], [data-comment]').forEach(el=>{
    el.addEventListener('click',async()=>{
      const wrap=document.createElement('div');
      wrap.innerHTML=`<div style="padding:14px 18px 6px">
        <textarea class="inp" id="cmtIn" maxlength="120" placeholder="说说你的看法…"></textarea></div>
        <div style="display:flex;gap:10px;padding:8px 18px 18px"><button class="btn btn-plain" style="flex:1" id="cCancel">取消</button><button class="btn btn-primary" style="flex:1" id="cSend">发送</button></div>`;
      openSheet('评论', wrap.innerHTML);
      const sheet=$('#sheetBody');
      const send=()=>{
        const v=$('#cmtIn',sheet).value.trim();
        const id=el.dataset.comment || parseHash().id;
        if(!v){ toast('请输入评论内容'); return; }
        store.counted[id]=v; closeSheet(); render(); toast('评论已发送');
      };
      $('#cSend',sheet).addEventListener('click',send);
      $('#cCancel',sheet).addEventListener('click',closeSheet);
    });
  });

  // 分享 / 关注 / 匹配
  view.querySelectorAll('[data-share]').forEach(el=>el.addEventListener('click',()=>toast('已生成分享卡片，可发给同校搭子')));
  const follow=view.querySelector('[data-act="follow"]');
  if(follow) follow.addEventListener('click',()=>{ follow.textContent='已关注'; follow.classList.add('btn-plain'); toast('已关注作者'); });
  const match=view.querySelector('[data-act="match"]');
  if(match) match.addEventListener('click',()=>{ toast('正在为你匹配同校搭子…'); setTimeout(()=>toast('已匹配 3 位同校玩家，去社区看看'),1200); });

  // 发布页
  if(currentRoute==='publish') bindPublish();
  // 组队
  if(currentRoute==='team') bindTeam();
}

function bindPublish(){
  const title=$('#pTitle'), body=$('#pBody');
  title.addEventListener('input',()=>{ pubTemp.title=title.value; $('#cntTitle').textContent=title.value.length; title.classList.remove('err'); $('#errTitle').classList.remove('show'); });
  body.addEventListener('input',()=>{ pubTemp.body=body.value; $('#cntBody').textContent=body.value.length; body.classList.remove('err'); $('#errBody').classList.remove('show'); });
  view.querySelectorAll('[data-tag]').forEach(b=>b.addEventListener('click',()=>{
    const t=b.dataset.tag;
    const on=pubTemp.tags.includes(t);
    pubTemp.tags = on? pubTemp.tags.filter(x=>x!==t) : [...pubTemp.tags,t];
    b.setAttribute('aria-pressed',String(!on));
    $('#errTag').classList.remove('show');
  }));
  view.querySelectorAll('[data-act="add-img"]').forEach(b=>b.addEventListener('click',()=>{
    const pool=[IMG.pyro,IMG.geo,IMG.hydro,IMG.electro];
    pubTemp.imgs.push(pool[pubTemp.imgs.length%pool.length]); render(); toast('已添加配图（演示）');
  }));
  view.querySelectorAll('[data-del-img]').forEach(b=>b.addEventListener('click',()=>{
    pubTemp.imgs.splice(Number(b.dataset.delImg),1); render();
  }));
  view.querySelectorAll('[data-act="save-draft"]').forEach(b=>b.addEventListener('click',()=>saveDraft()));
  view.querySelectorAll('[data-act="publish"]').forEach(b=>b.addEventListener('click',doPublish));
  view.querySelectorAll('[data-act="pub-back"]').forEach(b=>b.addEventListener('click',async()=>{
    if(!pubTemp.title && !pubTemp.body){ history.back(); return; }
    const ok=await confirmDialog({title:'离开编辑页？',content:'当前内容尚未发布，离开后将自动保存为草稿。',okText:'保存并离开'});
    if(ok){ saveDraft(true); history.back(); }
  }));
  // 自动保存
  clearInterval(window._autoSave);
  window._autoSave=setInterval(()=>{ if(currentRoute==='publish'&&(pubTemp.title||pubTemp.body)) saveDraft(false); },10000);
}
function saveDraft(showToast=true){
  if(!pubTemp.title && !pubTemp.body){ if(showToast) toast('还没有内容可以保存'); return; }
  const same=store.drafts.findIndex(d=>d.title===pubTemp.title&&d.body===pubTemp.body);
  if(same>-1) store.drafts.splice(same,1);
  store.drafts.unshift({title:pubTemp.title,body:pubTemp.body,tags:[...pubTemp.tags],time:'刚刚'});
  SAVE();
  if(showToast) toast('已保存草稿，可在「我的-草稿箱」继续编辑');
}
async function doPublish(){
  const btn=$('#btnPublish');
  let okAll=true;
  if(!pubTemp.title.trim()){ $('#errTitle').classList.add('show'); $('#pTitle').classList.add('err'); okAll=false; }
  if(!pubTemp.tags.length){ $('#errTag').classList.add('show'); okAll=false; }
  if(!pubTemp.body.trim()){ $('#errBody').classList.add('show'); $('#pBody').classList.add('err'); okAll=false; }
  if(!okAll){ toast('还有必填项没有完成'); return; }
  if(!store.loggedIn){
    const r=await confirmDialog({title:'需要登录',content:'登录后即可发布攻略，是否立即登录？',okText:'去登录'});
    if(!r){ toast('登录后即可参与互动'); return; }
    store.loggedIn=true; toast('已登录');
  }
  const goOn=await confirmDialog({title:'发布确认',content:'发布后所有同校玩家都能看到，内容将进入审核。确认发布？',okText:'确认发布'});
  if(!goOn) return;
  btn.disabled=true; btn.innerHTML='<span class="loading-dot"></span>发布中';
  setTimeout(()=>{
    if(store.netFail){
      const same=store.drafts.findIndex(d=>d.title===pubTemp.title&&d.body===pubTemp.body);
  if(same>-1) store.drafts.splice(same,1);
  store.drafts.unshift({title:pubTemp.title,body:pubTemp.body,tags:[...pubTemp.tags],time:'刚刚'});
      SAVE();
      btn.disabled=false; btn.textContent='发布';
      toast('网络异常，已为你保存草稿');
      return;
    }
    store.myPosts.unshift({id:'mp'+Date.now(),title:pubTemp.title,body:pubTemp.body,cover:IMG.geo,time:'刚刚',likes:0});
    pubTemp.title=''; pubTemp.body=''; pubTemp.tags=[]; pubTemp.imgs=[];
    SAVE();
    toast('发布成功');
    setTimeout(()=>{ go('myposts'); },900);
  },900);
}

function bindTeam(){
  const apply=view.querySelector('[data-act="apply"]');
  if(apply) apply.addEventListener('click',async()=>{
    const pid=parseHash().id;
    if(store.applied[pid]){
      const ok=await confirmDialog({title:'撤回申请',content:'撤回后队长将看不到你的申请，确定撤回？',okText:'撤回',danger:true});
      if(ok){ delete store.applied[pid]; SAVE(); render(); toast('已撤回申请'); }
      return;
    }
    const ok=await confirmDialog({title:'发送组队申请',content:'向队长发送申请，队长同意后才能进入队伍。确定申请？',okText:'确认申请'});
    if(ok){ store.applied[pid]=true; SAVE(); render(); toast('申请已发送，等待队长确认'); }
  });
  const cancel=view.querySelector('[data-act="team-cancel"]');
  if(cancel) cancel.addEventListener('click',async()=>{
    if(!store.applied[parseHash().id]){ toast('已生成队伍分享卡片'); return; }
    const ok=await confirmDialog({title:'放弃加入',content:'放弃后队长将看到你已退出，确定放弃？',okText:'确定放弃',danger:true});
    if(ok){ delete store.applied[parseHash().id]; SAVE(); history.back(); }
  });
  const more=view.querySelector('[data-act="team-more"]');
  if(more) more.addEventListener('click',()=>openSheet('更多操作','<button class="opt" data-act="report">举报该招募<span>›</span></button><button class="opt" data-act="copy">复制队伍信息<span>›</span></button>'));
}

/* 未登录拦截 */
document.addEventListener('click', async e=>{
  if(store.loggedIn) return;
  const t=e.target.closest('[data-like],[data-fav],[data-comment],[data-act="comment"],[data-act="apply"]');
  if(!t) return;
  e.stopPropagation(); e.preventDefault();
  const ok=await confirmDialog({title:'需要登录',content:'登录后才能点赞、收藏和评论，是否立即登录？',okText:'立即登录'});
  if(ok){
    store.loggedIn=true;
    const key = t.dataset.like?`[data-like="${t.dataset.like}"]` : (t.dataset.fav?`[data-fav="${t.dataset.fav}"]` : null);
    render();
    toast('登录成功，可以继续操作了');
    if(key){ const again=document.querySelector(key); if(again) again.click(); }
  }
}, true);

/* 我的子页事件 */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-del]');
  if(t){
    const id=t.dataset.del;
    const ok=await confirmDialog({title:'删除攻略',content:'删除后将无法恢复，确定要删除这篇攻略吗？',okText:'确认删除',danger:true});
    if(ok){ store.myPosts=store.myPosts.filter(p=>p.id!==id); SAVE(); render(); toast('已删除'); }
  }
  const ed=e.target.closest('[data-edit]');
  if(ed){ toast('演示版暂不支持在线编辑'); }
  const rd=e.target.closest('[data-deldraft]');
  if(rd){
    const i=Number(rd.dataset.deldraft);
    const ok=await confirmDialog({title:'删除草稿',content:'删除后无法恢复，确定删除？',okText:'删除',danger:true});
    if(ok){ store.drafts.splice(i,1); SAVE(); render(); toast('草稿已删除'); }
  }
  const rs=e.target.closest('[data-act="resume"]');
  if(rs){
    const d=store.drafts[Number(rs.dataset.i)];
    pubTemp.title=d.title; pubTemp.body=d.body; pubTemp.tags=d.tags||[]; pubTemp.imgs=[];
    go('publish');
  }
  const tg=e.target.closest('[data-toggle]');
  if(tg){ tg.setAttribute('aria-checked', tg.getAttribute('aria-checked')==='true'?'false':'true'); }
});

/* Tab 切换 */
$('#tabbar').addEventListener('click',e=>{
  const b=e.target.closest('.tab'); if(!b) return;
  const tab=b.dataset.tab;
  if(tab==='square'){ go('square'); return; }
  go(tab);
});

/* 搜索交互（渲染后绑定） */
const origRender=render;
render=function(){
  origRender();
  if(currentRoute==='search'){
    const inp=$('#sInput'); const hist=$('#histChips');
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ searchResults(inp.value); inp.blur(); } });
    const clearBtn=view.querySelector('[data-act="clear-input"]');
    if(clearBtn) clearBtn.addEventListener('click',()=>{ inp.value=''; $('#sResults').innerHTML=''; inp.focus(); });
    const doBtn=view.querySelector('[data-act="do-search"]');
    if(doBtn) doBtn.addEventListener('click',()=>searchResults(inp.value));
    if(hist) hist.querySelectorAll('[data-hist]').forEach(c=>c.addEventListener('click',()=>{ inp.value=c.dataset.hist; searchResults(inp.value); }));
    const clearHist=view.querySelector('[data-act="clear-hist"]');
    if(clearHist) clearHist.addEventListener('click',()=>{ $('#histWrap').style.display='none'; toast('已清空搜索历史'); });
  }
  view.querySelectorAll('[data-open]').forEach(el=>{
    if(el._bound) return; el._bound=true;
  });
};

/* 启动 */
store.homeState='loading';
render();
setTimeout(()=>{ store.homeState='normal'; if(currentRoute==='home') render(); },900);
</script>
</body>
